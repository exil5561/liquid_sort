# Codemagic CI/CD for Liquid Sort Puzzle (Flutter).
# Repo: https://github.com/exil5561/liquid_sort
# App Store Connect app ID: 6797199854
# Bundle ID: com.taslaktech.games.liquidsort
#
# One-time Codemagic setup:
# 1. Team integrations > Developer Portal: App Store Connect API key named
#    exactly "App Store Connect" (App Manager or Admin).
# 2. Application settings > Environment variables:
#      Name: CERTIFICATE_PRIVATE_KEY
#      Group: ios_credentials (or any group referenced below)
#      Secret: yes
#      Value: an RSA private key PEM used to create/reuse the Apple Distribution
#             certificate, e.g. generate once with:
#               openssl genrsa -out cert_key.pem 2048
#               type/copy the full cert_key.pem contents
# 3. Start workflow: ios-release

workflows:
  ios-release:
    name: iOS Release (TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: App Store Connect

    environment:
      flutter: 3.41.6
      xcode: latest
      cocoapods: default
      groups:
        - ios_credentials
      vars:
        BUNDLE_ID: com.taslaktech.games.liquidsort
        APP_STORE_APPLE_ID: 6797199854

    scripts:
      - name: Set up keychain
        script: |
          #!/bin/sh
          set -e
          keychain initialize
      - name: Fetch or create App Store signing files
        script: |
          #!/bin/sh
          set -e
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: |
          #!/bin/sh
          set -e
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          #!/bin/sh
          set -e
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          #!/bin/sh
          set -e
          cd "$CM_BUILD_DIR"
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          #!/bin/sh
          set -e
          cd "$CM_BUILD_DIR/ios"
          pod install
      - name: Static analysis
        script: |
          #!/bin/sh
          set -e
          cd "$CM_BUILD_DIR"
          flutter analyze --fatal-infos
      - name: Unit tests
        script: |
          #!/bin/sh
          set -e
          cd "$CM_BUILD_DIR"
          flutter test
        ignore_failure: true
      - name: Flutter build IPA
        script: |
          #!/bin/sh
          set -e
          cd "$CM_BUILD_DIR"
          flutter build ipa --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
